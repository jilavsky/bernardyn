[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bernardyn"
version = "0.0.1b1"
description = "Publication-oriented plotting workbench for small-angle scattering data"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jan Ilavsky"}]
keywords = ["SAXS", "SANS", "USAXS", "WAXS", "scattering", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "h5py>=3.0",
    "PyOpenGL>=3.1.7",
    "pyirena[qtplot]>=1.1.0b12,<2",
    # Imported directly by the renderers, so pinned here rather than left to
    # PyIrena.  PySide6 6.9.1 is excluded: QGraphicsItem.setParentItem fails
    # silently in that release and pyqtgraph plots come out empty.
    "pyqtgraph>=0.13.7",
    "PySide6>=6.8,!=6.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "pytest-qt>=4.2", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/jilavsky/Bernardyn"
Repository = "https://github.com/jilavsky/Bernardyn"
Issues = "https://github.com/jilavsky/Bernardyn/issues"

[project.gui-scripts]
bernardyn = "bernardyn.app:main"

[project.scripts]
bernardyn-doctor = "bernardyn.diagnostics:main"

[tool.setuptools.packages.find]
include = ["bernardyn*"]

[tool.setuptools.package-data]
bernardyn = ["schemas/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["performance: performance acceptance targets for reference desktops"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
