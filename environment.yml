name: bernardyn
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Pin the minor version: Bernardyn supports 3.10-3.13, not Python 3.14.
  - python=3.13
  - pip>=24
  - numpy>=2
  - scipy>=1.8
  - h5py>=3
  # PyIrena excludes PySide 6.7 and 6.10.  PySide 6.9.1 is excluded here too:
  # QGraphicsItem.setParentItem silently fails in that release, so
  # ViewBox.addItem never parents plot items and every plot renders empty.
  # 6.9.0, 6.9.2 and 6.9.3 are fine.
  - pyside6>=6.8,<6.10,!=6.9.1
  - pyqtgraph>=0.13.7
  - pyopengl>=3.1.7
  - pip:
      # The current Bernardyn beta uses the unreleased PyIrena shared API.
      # Both repositories are expected to be sibling directories.
      - -e ../pyirena[qtplot]
      - -e .[dev]
